<!-- wp:group {"tagName":"main","className":"coming-soon-main","layout":{"type":"default"}} -->
<main class="wp-block-group coming-soon-main">
	<!-- wp:group {"className":"coming-soon-container","layout":{"type":"constrained","contentSize":"640px"}} -->
	<div class="wp-block-group coming-soon-container">
		<!-- wp:site-logo {"width":120} /-->

		<!-- wp:heading {"textAlign":"center","level":1,"className":"coming-soon-title"} -->
		<h1 class="wp-block-heading has-text-align-center coming-soon-title">Coming Soon</h1>
		<!-- /wp:heading -->

		<!-- wp:paragraph {"align":"center","className":"coming-soon-description"} -->
		<p class="has-text-align-center coming-soon-description">We are currently crafting a brand new online experience. Leave us your email and we'll let you know when we are ready!</p>
		<!-- /wp:paragraph -->

		<!-- wp:html -->
		<div class="coming-soon-countdown" data-date="2026-10-31T23:59:59">
			<div class="countdown-item">
				<span class="countdown-number" id="days">00</span>
				<span class="countdown-label">Days</span>
			</div>
			<div class="countdown-item">
				<span class="countdown-number" id="hours">00</span>
				<span class="countdown-label">Hours</span>
			</div>
			<div class="countdown-item">
				<span class="countdown-number" id="minutes">00</span>
				<span class="countdown-label">Minutes</span>
			</div>
			<div class="countdown-item">
				<span class="countdown-number" id="seconds">00</span>
				<span class="countdown-label">Seconds</span>
			</div>
		</div>
		<!-- /wp:html -->

		<!-- wp:html -->
		<form class="coming-soon-subscribe-form">
			<input type="email" placeholder="Your email address..." required />
			<button type="submit">Notify Me</button>
			<div class="subscribe-message success" style="display:none;"></div>
			<div class="subscribe-message error" style="display:none;"></div>
		</form>
		<!-- /wp:html -->

		<!-- wp:social-links {"iconColor":"white","iconColorValue":"#ffffff","size":"has-normal-icon-size","align":"center","className":"coming-soon-social"} -->
		<ul class="wp-block-social-links has-normal-icon-size has-icon-color justify-content-center coming-soon-social">
			<!-- wp:social-link {"url":"https://facebook.com","service":"facebook"} /-->
			<!-- wp:social-link {"url":"https://instagram.com","service":"instagram"} /-->
			<!-- wp:social-link {"url":"https://twitter.com","service":"twitter"} /-->
		</ul>
		<!-- /wp:social-links -->
	</div>
	<!-- /wp:group -->
</main>
